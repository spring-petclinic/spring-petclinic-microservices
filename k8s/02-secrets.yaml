# Placeholder only. Do not commit real keys.
#
# Create it out-of-band instead:
#
#   kubectl create secret generic genai-secrets -n petclinic \
#     --from-literal=OPENAI_API_KEY=sk-...
#
# For anything beyond a demo cluster, replace this with External Secrets
# (an ExternalSecret pointing at AWS/GCP Secret Manager or Vault) or with the
# Vault Agent injector, so the key never exists as a manifest.
apiVersion: v1
kind: Secret
metadata:
  name: genai-secrets
  namespace: petclinic
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  AZURE_OPENAI_KEY: ""
  AZURE_OPENAI_ENDPOINT: ""

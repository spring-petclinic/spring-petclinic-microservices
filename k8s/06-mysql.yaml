# MySQL for the three data-owning services.
#
# One database, one schema, shared by customers/vets/visits - visits.pet_id is a
# foreign key onto pets.id, so the tables cannot be created independently. The
# schema and demo data are applied once, when the MySQL container initialises an
# empty data directory; the application pods run with spring.sql.init.mode=never.
#
# Single replica with a PVC. Replicating MySQL itself is out of scope here - use a
# managed database or an operator for anything real.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: petclinic
type: Opaque
stringData:
  # Demo values. Replace with a generated secret, External Secrets or Vault.
  MYSQL_ROOT_PASSWORD: petclinic-root
  MYSQL_PASSWORD: petclinic
---
# Regenerate after changing any db/mysql/*.sql:
#   python scripts/generate_mysql_initdb.py
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb
  namespace: petclinic
data:
  01-customers-schema.sql: |
    CREATE DATABASE IF NOT EXISTS petclinic;

    USE petclinic;

    CREATE TABLE IF NOT EXISTS types (
      id INT(4) UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
      name VARCHAR(80),
      INDEX(name)
    ) engine=InnoDB;

    CREATE TABLE IF NOT EXISTS owners (
      id INT(4) UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
      first_name VARCHAR(30),
      last_name VARCHAR(30),
      address VARCHAR(255),
      city VARCHAR(80),
      telephone VARCHAR(20),
      INDEX(last_name)
    ) engine=InnoDB;

    CREATE TABLE IF NOT EXISTS pets (
      id INT(4) UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
      name VARCHAR(30),
      birth_date DATE,
      type_id INT(4) UNSIGNED NOT NULL,
      owner_id INT(4) UNSIGNED NOT NULL,
      INDEX(name),
      FOREIGN KEY (owner_id) REFERENCES owners(id),
      FOREIGN KEY (type_id) REFERENCES types(id)
    ) engine=InnoDB;
  02-vets-schema.sql: |
    CREATE DATABASE IF NOT EXISTS petclinic;

    USE petclinic;

    CREATE TABLE IF NOT EXISTS vets (
      id INT(4) UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
      first_name VARCHAR(30),
      last_name VARCHAR(30),
      INDEX(last_name)
    ) engine=InnoDB;

    CREATE TABLE IF NOT EXISTS specialties (
      id INT(4) UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
      name VARCHAR(80),
      INDEX(name)
    ) engine=InnoDB;

    CREATE TABLE IF NOT EXISTS vet_specialties (
      vet_id INT(4) UNSIGNED NOT NULL,
      specialty_id INT(4) UNSIGNED NOT NULL,
      FOREIGN KEY (vet_id) REFERENCES vets(id),
      FOREIGN KEY (specialty_id) REFERENCES specialties(id),
      UNIQUE (vet_id,specialty_id)
    ) engine=InnoDB;
  03-visits-schema.sql: |
    CREATE DATABASE IF NOT EXISTS petclinic;

    USE petclinic;

    CREATE TABLE IF NOT EXISTS visits (
      id INT(4) UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
      pet_id INT(4) UNSIGNED NOT NULL,
      visit_date DATE,
      description VARCHAR(8192),
      FOREIGN KEY (pet_id) REFERENCES pets(id)
    ) engine=InnoDB;

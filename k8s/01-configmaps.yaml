apiVersion: v1
kind: ConfigMap
metadata:
  name: genai-service-config
  namespace: petclinic
data:
  application.yml: |
    # API keys are NOT here - they come from the genai-secrets Secret as env vars.
    petclinic:
      customers-service:
        url: http://customers-service:8081
      vets-service:
        url: http://vets-service:8083

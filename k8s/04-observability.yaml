# Zipkin, addressed by every service as http://tracing-server:9411 via the
# common ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracing-server
  namespace: petclinic
  labels:
    app: tracing-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracing-server
  template:
    metadata:
      labels:
        app: tracing-server
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:latest
          ports:
            - name: http
              containerPort: 9411
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tracing-server
  namespace: petclinic
  labels:
    app: tracing-server
spec:
  selector:
    app: tracing-server
  ports:
    - name: http
      port: 9411
      targetPort: http

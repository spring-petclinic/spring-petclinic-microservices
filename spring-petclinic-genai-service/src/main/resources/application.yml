spring:
  main:
    web-application-type: reactive

  application:
    name: genai-service

  profiles:
    active: production

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/},optional:classpath:/creds.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

  ai:
    chat:
      client:
        enabled: true

    # These apply when using spring-ai-starter-model-azure-openai
    azure:
      openai:
        api-key: ${AZURE_OPENAI_KEY}
        endpoint: ${AZURE_OPENAI_ENDPOINT}
        chat:
          options:
            temperature: 0.7
            deployment-name: gpt-4o

    # These apply when using spring-ai-starter-model-openai
    openai:
      api-key: ${OPENAI_API_KEY:demo}
      chat:
        options:
          temperature: 0.7
          model: gpt-4o-mini


logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG


---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

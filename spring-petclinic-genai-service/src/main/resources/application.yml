spring:
  main:
    web-application-type: reactive
  application:
    name: genai-service
  profiles:
    active: production
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/},optional:classpath:/creds.yaml
  ai:
    chat:
      client:
        enabled: true
    openai:
      api-key: ${OPENAI_API_KEY:demo}
      # Uncomment the following properties when using Azure OpenAI / Microsoft Foundry:
      # base-url: ${AZURE_OPENAI_ENDPOINT}
      # microsoft-foundry: true
      chat:
        temperature: 0.7
        model: gpt-4o-mini
        # microsoft-deployment-name: gpt-4o


logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888

# Started in Phase 1 and kept under this name; later phases add their jobs here.
name: Phase 1 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  compose-validate:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate compose syntax
      env:
        # Placeholders so interpolation does not warn; nothing is started here
        OPENAI_API_KEY: ci
        AZURE_OPENAI_KEY: ci
        AZURE_OPENAI_ENDPOINT: http://localhost
      run: docker compose -f docker-compose.yml config --quiet
    - name: Check Kafka services are defined
      run: |
        services="$(docker compose -f docker-compose.yml config --services)"
        for svc in kafka kafka-init kafka-ui; do
          grep -qx "${svc}" <<< "${services}" || { echo "::error::service '${svc}' missing from docker-compose.yml"; exit 1; }
        done

  contract-test:
    name: VisitEvent contract test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install jsonschema
      run: pip install -r contracts/requirements.txt
    - name: Validate examples against the schema
      run: python contracts/validate-events.py --expect 16

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run shellcheck on all shell scripts
      run: |
        shellcheck --version
        mapfile -t scripts < <(git ls-files '*.sh')
        if (( ${#scripts[@]} == 0 )); then
          echo "No shell scripts found"
          exit 0
        fi
        # Upstream scripts we do not own are held to warnings only; everything else gets the full check
        legacy=(scripts/pushImages.sh scripts/tagImages.sh scripts/run_all.sh scripts/stop_all.sh scripts/chaos/call_chaos.sh)
        ours=()
        for script in "${scripts[@]}"; do
          [[ " ${legacy[*]} " == *" ${script} "* ]] || ours+=("${script}")
        done
        printf 'Checking (warnings and errors): %s\n' "${legacy[@]}"
        shellcheck --severity=warning "${legacy[@]}"
        if (( ${#ours[@]} > 0 )); then
          printf 'Checking (all findings): %s\n' "${ours[@]}"
          shellcheck "${ours[@]}"
        fi

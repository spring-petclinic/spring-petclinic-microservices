input {
  beats {
    port => 5044
  }
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # If input is from filebeat or raw string, try to parse JSON if message is JSON formatted
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "log"
      skip_on_invalid_json => true
    }
  }

  # Parse standard Spring Boot log format with Micrometer traceId/spanId if present
  # Example: 2026-11-11T21:00:00.000Z INFO [customers-service,4b8c9d...,9a8b7c...] 1 --- [main] org.springframework... : Started ...
  grok {
    match => {
      "message" => "(?m)^%{TIMESTAMP_ISO8601:timestamp}\s+%{LOGLEVEL:log_level}\s+(\[(?<service_name>[^,]+)?,(?<trace_id>[^,]+)?,(?<span_id>[^\]]+)?\])?\s*%{NUMBER:pid:int}?\s*---\s*(\[(?<thread_name>[^\]]+)\])?\s*(?<logger>[^:]+)\s*:\s*%{GREEDYDATA:message_body}"
    }
    overwrite => [ "message" ]
    tag_on_failure => [ "_grok_spring_parse_failure" ]
  }

  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS", "yyyy-MM-dd'T'HH:mm:ss.SSSZ" ]
    target => "@timestamp"
    remove_field => [ "timestamp" ]
  }

  mutate {
    add_field => {
      "application" => "spring-petclinic"
    }
  }
}

output {
  elasticsearch {
    hosts => [ "http://elasticsearch:9200" ]
    index => "petclinic-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}


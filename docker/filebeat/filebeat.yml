filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: false

  - type: log
    enabled: true
    paths:
      - /usr/share/filebeat/logs/*.log
      - /logs/*.log

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info


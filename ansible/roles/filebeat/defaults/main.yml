---
filebeat_version: "{{ elastic_version | default('8.15.0') }}"
filebeat_logstash_host: "{{ logstash_host }}:{{ logstash_beat_port }}"
filebeat_inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: false


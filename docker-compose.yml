# Local stand-in for the Kubernetes deployment.
#
# There is no config server and no service registry: every service reads its
# configuration from ./config (the ConfigMaps) and addresses its peers by
# container name, exactly as it will address Kubernetes Services by DNS name.
#
# Images come from the local build:  ./mvnw clean install -PbuildDocker

x-petclinic-service: &petclinic-service
  deploy:
    resources:
      limits:
        memory: 512M
  # Mirrors the Kubernetes readinessProbe.
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:$$SERVICE_PORT/actuator/health/readiness || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 40s

services:
  # Shared database for customers/vets/visits. The schema spans the three
  # services (visits.pet_id references pets.id), so it is created once here, on
  # first start, from the same db/mysql/*.sql the Kubernetes ConfigMap uses.
  # The numeric prefixes fix the order MySQL applies them in.
  petclinic-mysql:
    image: mysql:8.4
    container_name: petclinic-mysql
    # Defaults are sized for a dedicated host; performance_schema alone costs a
    # few hundred MiB. Keep this in step with k8s/06-mysql.yaml.
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=256M
    environment:
      - MYSQL_ROOT_PASSWORD=petclinic-root
      - MYSQL_DATABASE=petclinic
      - MYSQL_USER=petclinic
      - MYSQL_PASSWORD=petclinic
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
      - ./spring-petclinic-customers-service/src/main/resources/db/mysql/schema.sql:/docker-entrypoint-initdb.d/01-customers-schema.sql:ro
      - ./spring-petclinic-vets-service/src/main/resources/db/mysql/schema.sql:/docker-entrypoint-initdb.d/02-vets-schema.sql:ro
      - ./spring-petclinic-visits-service/src/main/resources/db/mysql/schema.sql:/docker-entrypoint-initdb.d/03-visits-schema.sql:ro
      - ./spring-petclinic-customers-service/src/main/resources/db/mysql/data.sql:/docker-entrypoint-initdb.d/04-customers-data.sql:ro
      - ./spring-petclinic-vets-service/src/main/resources/db/mysql/data.sql:/docker-entrypoint-initdb.d/05-vets-data.sql:ro
      - ./spring-petclinic-visits-service/src/main/resources/db/mysql/data.sql:/docker-entrypoint-initdb.d/06-visits-data.sql:ro
    ports:
      - 3306:3306

  customers-service:
    <<: *petclinic-service
    image: springcommunity/spring-petclinic-customers-service
    container_name: customers-service
    environment:
      - SERVICE_PORT=8081
      - SPRING_PROFILES_ACTIVE=mysql
      - MYSQL_HOST=petclinic-mysql
      - MYSQL_USER=petclinic
      - MYSQL_PASSWORD=petclinic
    depends_on:
      petclinic-mysql:
        condition: service_healthy
    volumes:
      - ./config/common:/config/common:ro
      - ./config/customers-service:/config/app:ro
    ports:
      - 8081:8081

  visits-service:
    <<: *petclinic-service
    image: springcommunity/spring-petclinic-visits-service
    container_name: visits-service
    environment:
      - SERVICE_PORT=8082
      - SPRING_PROFILES_ACTIVE=mysql
      - MYSQL_HOST=petclinic-mysql
      - MYSQL_USER=petclinic
      - MYSQL_PASSWORD=petclinic
    depends_on:
      petclinic-mysql:
        condition: service_healthy
    volumes:
      - ./config/common:/config/common:ro
      - ./config/visits-service:/config/app:ro
    ports:
      - 8082:8082

  vets-service:
    <<: *petclinic-service
    image: springcommunity/spring-petclinic-vets-service
    container_name: vets-service
    environment:
      - SERVICE_PORT=8083
      - SPRING_PROFILES_ACTIVE=production,mysql
      - MYSQL_HOST=petclinic-mysql
      - MYSQL_USER=petclinic
      - MYSQL_PASSWORD=petclinic
    depends_on:
      petclinic-mysql:
        condition: service_healthy
    volumes:
      - ./config/common:/config/common:ro
      - ./config/vets-service:/config/app:ro
    ports:
      - 8083:8083

  genai-service:
    <<: *petclinic-service
    image: springcommunity/spring-petclinic-genai-service
    container_name: genai-service
    environment:
      # Supplied by a Kubernetes Secret in the cluster; by .env locally.
      - SERVICE_PORT=8084
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
    volumes:
      - ./config/common:/config/common:ro
      - ./config/genai-service:/config/app:ro
    ports:
      - 8084:8084

  api-gateway:
    <<: *petclinic-service
    image: springcommunity/spring-petclinic-api-gateway
    container_name: api-gateway
    environment:
      - SERVICE_PORT=8080
    volumes:
      - ./config/common:/config/common:ro
      - ./config/api-gateway:/config/app:ro
    ports:
      - 8080:8080

  tracing-server:
    image: openzipkin/zipkin
    container_name: tracing-server
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - 9411:9411

  ## Grafana / Prometheus

  grafana-server:
    build: ./docker/grafana
    container_name: grafana-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - 3030:3000

  prometheus-server:
    build: ./docker/prometheus
    container_name: prometheus-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - 9091:9090

volumes:
  mysql-data:

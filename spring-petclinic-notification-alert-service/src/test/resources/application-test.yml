spring:
  cloud:
    config:
      enabled: false
  config:
    import: ""
  # What the shared config server sends to every service
  sql:
    init:
      schema-locations: classpath*:db/hsqldb/schema.sql
      data-locations: classpath*:db/hsqldb/data.sql

eureka:
  client:
    enabled: false

petclinic:
  events:
    retry-interval: 100ms

server:
  port: 8888

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_URL:http://localhost:9000}

  cloud:
    config:
      server:
        git:
          uri: https://github.com/spring-petclinic/spring-petclinic-microservices-config
          default-label: main

        # Use the File System Backend to avoid git pulling.
        # Enable "native" profile in the Config Server.
        native:
          searchLocations: file:///${GIT_REPO}
